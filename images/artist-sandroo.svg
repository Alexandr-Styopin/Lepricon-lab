<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241e12"/>
      <stop offset="60%" stop-color="#12110e"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe596"/>
      <stop offset="50%" stop-color="#f3c34c"/>
      <stop offset="100%" stop-color="#b6831e"/>
    </linearGradient>
    <linearGradient id="gold-subtle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(243, 195, 76, 0.35)"/>
      <stop offset="100%" stop-color="rgba(243, 195, 76, 0.08)"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="118" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Headphone arch -->
  <path d="M68 114 A52 52 0 0 1 172 114" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <!-- Head silhouette -->
  <circle cx="120" cy="112" r="38" fill="url(#gold-subtle)" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- Shoulders -->
  <path d="M58 206 c0-38 28-56 62-56 s62 18 62 56" fill="url(#gold-subtle)" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Earcups -->
  <rect x="60" y="100" width="16" height="30" rx="8" fill="#17140e" stroke="url(#gold)" stroke-width="3"/>
  <rect x="164" y="100" width="16" height="30" rx="8" fill="#17140e" stroke="url(#gold)" stroke-width="3"/>
  <!-- DJ vinyl / sound badge -->
  <circle cx="120" cy="112" r="14" fill="#0a0a0b" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="120" cy="112" r="4" fill="url(#gold)"/>
</svg>
